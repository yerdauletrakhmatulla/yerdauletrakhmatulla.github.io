<header class="site-header wrap">
  <a class="site-name" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
  <div class="site-menus">
    <nav class="site-nav" aria-label="{{ i18n "mainNav" }}">
      {{- $cur := . }}
      {{- range slice "about" "posts" }}
      {{- with site.GetPage . }}
      <a href="{{ .RelPermalink }}"{{ if or (eq $cur .) ($cur.IsDescendant .) }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
      {{- end }}
      {{- end }}
    </nav>
    <nav class="lang" aria-label="{{ i18n "language" }}">
      {{- range .AllTranslations }}
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}"{{ if eq .Language.Lang site.Language.Lang }} aria-current="true"{{ end }}>{{ .Language.Label }}</a>
      {{- end }}
    </nav>
  </div>
</header>
