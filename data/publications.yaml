# Publications, statements and talks. One list serves all three languages.
# kind: reports | conference | articles | statements | talks
# date + precision: precision is day, month (default) or year; for month/year use the 1st.
# title / publisher stay in the original language. lang: language of the title (default en).
# role (optional): lecturer | panellist | speaker | presenter
# note (optional): short note in en / ru / kk
# links (optional): extra links; use `key` + `name` for a translated label, or `label` for a fixed one.

