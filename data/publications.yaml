# Publications, statements and talks. One list serves all three languages.
# kind: reports | conference | articles | statements | talks
# date + precision: precision is day, month (default) or year; for month/year use the 1st.
# title: stays in the original language; lang: language of the title (default en).
# publisher: a string, or a map with en / ru / kk.
# role (optional): lecturer | panellist | speaker | presenter | briefing
# note (optional): short note in en / ru / kk.
# url (optional): link to the item. page (optional): a post on this site, e.g. "/posts/2026-10-26-bangkok-panel-briefing".
# links (optional): extra links; `key` + `name` for a translated label, or `label` for a fixed one.
# show_from (optional): date from which the item appears.

