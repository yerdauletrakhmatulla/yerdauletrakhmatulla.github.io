baseURL = "https://yerdauletrakhmatulla.com/"
title = "Yerdaulet Rakhmatulla"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Dates without a time are read as Kazakhstan time. Posts dated in the future
# appear on their date: the site is rebuilt every morning (see .github/workflows/deploy.yml).
timeZone = "Asia/Almaty"

# LIVE since 25 Oct 2026. For review mode again: buildDrafts = true, and noindex = true under [params].
buildDrafts = false

[params]
  noindex = false
  email = "salem@yerdauletrakhmatulla.com"
  linkedin = "https://www.linkedin.com/in/yerdaulet/"
  [params.names]
    en = "Yerdaulet Rakhmatulla"
    kk = "Ердәулет Рахматулла"
    ru = "Ердаулет Рахматулла"

# Link previews (Media page, posts) are fetched when the site is built and kept for 30 days.
[caches.getresource]
  dir = ":cacheDir/:project"
  maxAge = "720h"

[taxonomies]
  category = "categories"

[permalinks.page]
  posts = "/posts/:slug/"

[languages]
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
    contentDir = "content/en"
    title = "Yerdaulet Rakhmatulla"
  [languages.ru]
    label = "Русский"
    locale = "ru"
    weight = 3
    contentDir = "content/ru"
    title = "Ердаулет Рахматулла"
  [languages.kk]
    label = "Қазақша"
    locale = "kk"
    weight = 1
    contentDir = "content/kk"
    title = "Ердәулет Рахматулла"
