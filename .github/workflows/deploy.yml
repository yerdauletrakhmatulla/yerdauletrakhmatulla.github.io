name: Build and publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Set cache folder
        run: echo "HUGO_CACHEDIR=${{ runner.temp }}/hugo_cache" >> "$GITHUB_ENV"
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6
      # Keeps link-preview images between builds, so a site that is briefly down
      # or blocks the build server does not lose its preview.
      - name: Restore preview cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-cache-${{ github.run_id }}
          restore-keys: hugo-cache-
      - name: Build
        run: |
          set -o pipefail
          hugo --minify 2>&1 | tee "${{ runner.temp }}/build.log"
      - name: Report link previews
        run: |
          grep -o 'preview: .*' "${{ runner.temp }}/build.log" | cut -c1-200 | sed 's/^/::warning title=Link preview::/' || true
          echo "::notice title=Link previews::$(find public -name '*_hu_*.webp' | wc -l) preview images built"
      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
